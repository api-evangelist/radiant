name: Radiant
description: Radiant is a nuclear technology company developing portable, transportable microreactors
  designed to deliver clean, reliable power to remote sites, military installations, disaster-relief
  operations, and industrial locations that today depend on diesel generators. Its flagship Kaleidos
  reactor is a factory-built, containerized ~1 MW microreactor intended to ship by truck, plane, or ship
  and be operational quickly on-site. Founded by former SpaceX engineers and headquartered in El Segundo,
  California, Radiant is backed by DCVC and Union Square Ventures. As of this enrichment pass the company
  publishes a corporate and careers web presence but no public developer program, API, SDK, or technical
  documentation surface.
